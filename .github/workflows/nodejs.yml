name: setup nodejs
on:
    push:
        branches:  ["main"]
    jobs:
        build:
            runs-on: ubuntu-latest
            steps:
                - name: Use nodejs ${{matrix.node-version}}
                - uses: actions/setup-node@v4
                  with:
                        node-version: [21]
                   cache: "npm"
                - run: npm ci
                - run: npm test
                - run: npm run build --if-present