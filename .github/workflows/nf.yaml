name: Creating an example 5G NF downloadable artifact

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
    - name: Build
      run: make build
    - name: Upload NF
      uses: actions/upload-artifact@v4
      with:
          name: NF
          path: NF